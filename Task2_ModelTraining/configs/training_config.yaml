# Task 2: YOLO Model Training Configuration

# Model settings
model: "yolo11n-pose.pt"        # Model architecture (YOLO11 latest)
imgsz: 640                      # Input image size
batch: 16                       # Batch size
device: 0                       # GPU device (0 for first GPU, cpu for CPU)

# Training parameters
epochs: 100                     # Number of training epochs
patience: 50                    # Early stopping patience
save_period: 10                 # Save checkpoint every N epochs
val: true                       # Validate during training
plots: true                     # Generate training plots

# Data augmentation
hsv_h: 0.015                    # HSV-Hue augmentation
hsv_s: 0.7                      # HSV-Saturation augmentation
hsv_v: 0.4                      # HSV-Value augmentation
degrees: 0.0                    # Rotation degrees
translate: 0.1                  # Translation fraction
scale: 0.5                      # Scale gain
shear: 0.0                      # Shear degrees
perspective: 0.0                # Perspective gain
flipud: 0.0                     # Vertical flip probability
fliplr: 0.5                     # Horizontal flip probability
mosaic: 1.0                     # Mosaic augmentation probability
mixup: 0.0                      # Mixup augmentation probability

# Optimization
optimizer: "auto"               # Optimizer (auto, SGD, Adam, AdamW)
lr0: 0.01                       # Initial learning rate
lrf: 0.01                       # Final learning rate
momentum: 0.937                 # Momentum
weight_decay: 0.0005            # Weight decay
warmup_epochs: 3.0              # Warmup epochs
warmup_momentum: 0.8            # Warmup momentum
warmup_bias_lr: 0.1             # Warmup bias learning rate

# Loss function
box: 7.5                        # Box loss gain
cls: 0.5                        # Classification loss gain
dfl: 1.5                        # DFL loss gain
pose: 12.0                      # Pose loss gain
kobj: 2.0                       # Keypoint object loss gain

# Pose specific settings
kpt_shape: [3, 3]               # Keypoint shape [num_keypoints, 3] (x, y, visibility)
flip_idx: [0, 2, 1]             # Keypoint flip indices

# Output settings
project: "Task2_ModelTraining/results"
name: "yolo_training"
save: true
save_txt: true
save_conf: true
save_crop: false
show_labels: true
show_conf: true
show_boxes: true
